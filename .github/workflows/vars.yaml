name: Variables demo
run-name: Variables demo
on: push
env:
  NAME: Ajay
  VAR_REP_NAME: ${{ vars.REP_VAR }}
jobs:
  job1:
    runs-on: ubuntu-latest
    environment: DEV
    steps:
    - name: step1
      run: echo "The name is - ${{ env.NAME }}"
    - name: step2
      run: echo "This value is from repo - ${{ env.VAR_REP_NAME }}"
    - name: step3
      run: echo "This value is from repo - ${{ secrets.REP_SECRET }}"
    - name: step4
      run: env
    - name: step5
      run: echo ${{ ENV_VAR }}
