name: Conditional WF
run-name: Conditional WF
on: push
jobs:
  job1:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - name: step1
      run: abc
    - name: step2
      run: echo "Job1 - Step2"
    - name: step3
      run: echo "Job1 - Step3"
  job2:
    runs-on: ubuntu-slim
    needs: job1
    steps:
    - name: step1
      run: echo "Job2 - Step1"
    - name: step2
      run: echo "Job2 - Step2"
    - name: step3
      run: echo "Job2 - Step3"
  job3:
    runs-on: ubuntu-slim
    steps:
    - name: step1
      run: echo "Job3 - Step1"
    - name: step2
      run: echo "Job3 - Step2"
    - name: step3
      run: echo "Job3 - Step3"
